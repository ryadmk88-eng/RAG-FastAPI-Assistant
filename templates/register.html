{% extends "base.html" %}

{% block title %}
Create account · FastAPI Assistant
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <a
            href="/"
            class="auth-back"
        >
            ← Back to assistant
        </a>


        <div class="auth-heading">

            <h1>
                Create your account
            </h1>

            <p>
                Sign up to save your chats,
                history and feedback.
            </p>

        </div>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="post"
            action="/register"
            class="auth-form"
        >

            <div class="auth-field">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ name or '' }}"
                    placeholder="Your name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email or '' }}"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="confirm_password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Repeat your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Create account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="/login">
                Sign in
            </a>

        </div>

    </div>

</section>

{% endblock %}
